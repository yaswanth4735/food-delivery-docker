# Docker Compose for Food Delivery Application
version: '3.8'

services:
  # MySQL Database Service
  db:
    image: mysql:8.0
    container_name: food_delivery_db
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: food_delivery
      MYSQL_USER: fooduser
      MYSQL_PASSWORD: foodpass123
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - food_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Food Delivery Application Service
  app:
    image: foodimage:latest
    container_name: food_delivery_app
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/food_delivery
      SPRING_DATASOURCE_USERNAME: fooduser
      SPRING_DATASOURCE_PASSWORD: foodpass123
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: false
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - food_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  db_data:
    driver: local

networks:
  food_network:
    driver: bridge
